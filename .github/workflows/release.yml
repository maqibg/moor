            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version consistency
        run: node scripts/sync-version.mjs --check

      - name: Extract changelog for release
        id: changelog
        shell: bash
        run: |
          {
            echo "body<<EOF"
            node scripts/extract-changelog.mjs
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true
          cache-workspaces: "src-tauri -> target"
          cache-key: ${{ matrix.target }}-no-cargo-bin-v1
          cache-bin: false
          cache-save-if: false
          rustflags: ""

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: "Moor ${{ steps.release.outputs.tag }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          args: "--target ${{ matrix.target }}"

      - name: Collect bundle diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail

          echo "Host runtime:"
          node -p "JSON.stringify({execPath:process.execPath,version:process.version,platform:process.platform,arch:process.arch})"

          echo "Rust toolchain:"
          command -v rustup || true
          command -v rustc || true
          command -v cargo || true
          if command -v cargo >/dev/null 2>&1; then
            cargo --version || true
          fi
          rustup show active-toolchain || true
          rustup target list --installed || true

          echo "Bundle directory:"
          find src-tauri/target -path "*/release/bundle/nsis/*" -print || true
          find src-tauri/target -path "*/release/bundle/msi/*" -print || true

      - name: Upload Windows diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis
            src-tauri/target/release/bundle/nsis

  build-linux:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-22.04-arm"
            target: "aarch64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            libfuse2 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

