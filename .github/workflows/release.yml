          find src-tauri/target -path "*/release/bundle/rpm/*" -print || true
          find src-tauri/target -path "*/release/bundle/appimage/*" -print || true

      - name: Upload Linux diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-diagnostics-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage
