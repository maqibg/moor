name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # crate 在子目录,须显式指定否则 rust-cache 键指向仓库根
          cache-workspaces: src-tauri

      # frontendDist ../dist 被 gitignore;无 dist 时 tauri generate_context! 编译失败
      - name: Placeholder frontend dist
        run: mkdir -p dist && echo '<!doctype html><title>ci-placeholder</title>' > dist/index.html

      - name: Run cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # cargo-test 不覆盖前端;类型错误须在 push 阶段拦截,而非 release 构建时爆
      - name: Lint, format check and type-check
        run: pnpm exec vp check

      - name: Run frontend tests
        run: pnpm exec vp test
