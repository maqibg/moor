name: 功能建议 / Feature Request
description: 提出新功能或改进建议 / Suggest a new feature or improvement
title: "[Feature] "
labels: ["needs-triage", "enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 需求 / 动机 / Motivation
      description: 你想解决什么问题？这个功能为什么重要？/ What problem are you trying to solve, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 设想方案 / Proposed Solution
      description: 你希望 Moor 如何实现？/ How would you like Moor to implement this?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives Considered
      description: 你考虑过的其他做法 / Other approaches you have considered
  - type: checkboxes
    id: contribute
    attributes:
      label: 贡献意愿 / Contribution
      options:
        - label: 我愿意为此提交 PR / I am willing to submit a PR for this
