name: Bug 报告 / Bug Report
description: 报告 Moor 的功能缺陷 / Report a defect in Moor
title: "[Bug] "
labels: ["needs-triage", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，以便我们快速定位问题。
        Thanks for reporting! Please fill in as much detail as possible.
  - type: input
    id: version
    attributes:
      label: Moor 版本 / Moor Version
      description: 你正在使用的 Moor 版本 / The Moor version you are using
      placeholder: "如 / e.g. 0.6.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统 / Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: MCP Server 传输类型 / MCP Server Transport
      description: 出现问题的 MCP Server 连接方式 / The transport of the affected MCP server
      options:
        - stdio
        - Streamable HTTP
        - 不确定 / Not sure
    validations:
      required: true
  - type: dropdown
    id: runmode
    attributes:
      label: 运行模式 / Run Mode
      options:
        - 桌面应用 pnpm tauri dev / Desktop (pnpm tauri dev)
        - 纯浏览器 pnpm dev（指向外部网关）/ Browser-only (pnpm dev)
        - 生产构建 / Production build
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Reproduction Steps
      description: 可复现的操作步骤 / Step-by-step actions to reproduce the issue
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期 vs 实际 / Expected vs Actual
      placeholder: |
        预期 / Expected: ...
        实际 / Actual: ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / Relevant Logs
      description: |
        网关默认端口 9223；数据目录 ~/Library/Application Support/com.snowautumn.moor/（macOS）。
        Default gateway port 9223; data dir ~/Library/Application Support/com.snowautumn.moor/ (macOS).
      render: shell
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认 / Confirm
      options:
        - label: 我已搜索现有 issue，确认无重复 / I searched existing issues and confirmed no duplicate
          required: true
        - label: 我已在最新版本上复现 / I reproduced this on the latest version
          required: true
